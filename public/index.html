<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>TodoList v2.0</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <header>

        <h1>TodoList v2.0</h1>

        <p>
            Gestor de tareas - Versión 2.0
        </p>

    </header>


    <main>

        <!-- FORMULARIO PARA CREAR TAREAS -->

        <section class="formulario">

            <h2>Crear nueva tarea</h2>

            <form id="formTarea">

                <input
                    type="text"
                    id="titulo"
                    placeholder="Título de la tarea"
                    required
                >

                <textarea
                    id="descripcion"
                    placeholder="Descripción de la tarea"
                ></textarea>

                <select id="estado">

                    <option value="PENDIENTE">
                        PENDIENTE
                    </option>

                    <option value="EN PROGRESO">
                        EN PROGRESO
                    </option>

                    <option value="COMPLETADA">
                        COMPLETADA
                    </option>

                </select>

                <button type="submit">
                    Crear tarea
                </button>

            </form>

        </section>


        <!-- NUEVA FUNCIONALIDAD DE V2 -->

        <section class="filtros">

            <h2>
                Buscar y filtrar tareas
            </h2>

            <input
                type="text"
                id="busqueda"
                placeholder="Buscar por título o descripción..."
            >


            <select id="filtroEstado">

                <option value="TODOS">
                    Todos los estados
                </option>

                <option value="PENDIENTE">
                    PENDIENTE
                </option>

                <option value="EN PROGRESO">
                    EN PROGRESO
                </option>

                <option value="COMPLETADA">
                    COMPLETADA
                </option>

            </select>

        </section>


        <!-- LISTA DE TAREAS -->

        <section>

            <h2>
                Lista de tareas
            </h2>

            <div id="listaTareas"></div>

        </section>

    </main>


    <script src="app.js"></script>

</body>

</html>
